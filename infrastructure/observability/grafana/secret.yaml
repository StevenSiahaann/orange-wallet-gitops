---
# =============================================================================
# Grafana - Admin Password Secret (Template / Placeholder)
# =============================================================================
# In production, use External Secrets Operator + GCP Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "<GRAFANA_ADMIN_PASSWORD_PLACEHOLDER>"
