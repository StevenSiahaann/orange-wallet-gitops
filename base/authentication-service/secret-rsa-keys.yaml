---
# =============================================================================
# Authentication Service - RSA Keys Secret (Template / Placeholder)
# =============================================================================
# RSA public and private keys for JWT token signing.
# In production, keys are managed securely via Secret Manager / External Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: auth-rsa-keys
  namespace: orange-wallet
  labels:
    app: authentication-service
type: Opaque
stringData:
  jwtRS256.key: |
    -----BEGIN RSA PRIVATE KEY-----
    <BASE64_RSA_PRIVATE_KEY_PLACEHOLDER>
    -----END RSA PRIVATE KEY-----
  jwtRS256.key.pub: |
    -----BEGIN PUBLIC KEY-----
    <BASE64_RSA_PUBLIC_KEY_PLACEHOLDER>
    -----END PUBLIC KEY-----
